[tool.ruff]
target-version = "py312"
line-length = 100
# Saved tutorial pages and notebooks: third-party content, never linted or reformatted.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not llm"'
markers = [
    "docker: integration tests requiring Docker and the worksfr-sandbox image",
    "llm: opt-in live requests to configured LLM providers",
]
